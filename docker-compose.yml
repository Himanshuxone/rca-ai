version: "3.9"
services:
  frontend:
    build: ./frontend
    container_name: rca-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rca-net

  backend:
    build: ./backend
    container_name: rca-ai-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:admin123@db:5432/techrca
    depends_on:
      - db
    networks:
      - rca-net

  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: techrca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  rca-net:
